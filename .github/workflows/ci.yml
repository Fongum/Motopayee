name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # `next build` is not the same check as tsc. It lints test files that
      # `npm run lint` does not reach, so an unused `_`-prefixed binding passes
      # lint and tsc and fails only here — which happened during this branch.
      # It also runs on Linux, and a route-resolution bug in one of these tests
      # was green on Windows and red here for five pushes. Running the build is
      # what Vercel does; CI should find it first.
      - name: Production build
        run: npm run build
        env:
          # Build-time only. NEXT_PUBLIC_* are inlined at build, so the build
          # needs values present — these are placeholders, not real credentials,
          # and nothing in the build contacts Supabase.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          NEXT_PUBLIC_APP_URL: https://example.invalid
